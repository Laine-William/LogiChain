paths:
  /api/notifications:
    get:
      summary: Liste toutes les notifications
      tags: [Notifications]
      responses:
        200:
          description: Liste toutes les notifications récupérées
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'
    post:
      summary: Crée une nouvelle notification
      tags: [Notifications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationCreate'
      responses:
        201:
          description: Notification créée avec succès
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        400:
          description: Données invalides

  /api/notifications/user/{userId}:
    get:
      summary: Liste les notifications d'un utilisateur
      tags: [Notifications]
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        200:
          description: Toutes les notifications de l'utilisateur
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'
        404:
          description: Utilisateur introuvable

  /api/notifications/type/{type}:
    get:
      summary: Liste les notifications par type
      tags: [Notifications]
      parameters:
        - in: path
          name: type
          required: true
          schema:
            type: string
            enum: ['system', 'alert', 'info', 'warning']
      responses:
        200:
          description: Liste des notifications filtrées par type
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'
        400:
          description: Type de notification invalide

  /api/notifications/{id}/type:
    patch:
      summary: Met à jour le type d'une notification
      tags: [Notifications]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type:
                  type: string
                  enum: ['system', 'alert', 'info', 'warning']
      responses:
        200:
          description: Type de notification mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        400:
          description: Données invalides
        404:
          description: Notification introuvable

  /api/notifications/user/{userId}/read/{id}:
    patch:
      summary: Marquer une notification d'un utilisateur comme lue
      tags: [Notifications]
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Notification marquée comme lue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        404:
          description: Notification ou utilisateur introuvable

  /api/notifications/user/{userId}/read-all:
    patch:
      summary: Marquer toutes les notifications d'un utilisateur comme lues
      tags: [Notifications]
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        200:
          description: Toutes les notifications marquées comme lues
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'
        404:
          description: Utilisateur introuvable