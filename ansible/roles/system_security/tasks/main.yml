- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install Fail2Ban and UFW
  apt:
    name: ["fail2ban", "ufw"]
    state: present

- name: Configure UFW default policies
  ufw:
    state: enabled
    policy: deny
    direction: incoming

- name: Allow essential ports via UFW
  ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - '22'
    - '80'
    - '443'
