- name: Installer les dépendances pour les dépôts externes
  apt:
    name:
      - gnupg
      - curl
    state: present
    update_cache: yes

- name: Télécharger et ajouter la clé GPG MongoDB
  get_url:
    url: https://www.mongodb.org/static/pgp/server-7.0.asc
    dest: /usr/share/keyrings/mongodb-server-7.0.gpg
    mode: '0644'

- name: Supprimer tout ancien dépôt MongoDB conflictuel
  file:
    path: /etc/apt/sources.list.d/mongodb-org-7.0.list
    state: absent

- name: Ajouter le dépôt officiel MongoDB pour Debian avec tolérance d'insécurité (SHA1)
  copy:
    dest: /etc/apt/sources.list.d/mongodb-org-7.0.list
    content: "deb [ signed-by=/usr/share/keyrings/mongodb-server-7.0.gpg allow-insecure=yes ] https://repo.mongodb.org/apt/debian bookworm/mongodb-org/7.0 main\n"
    owner: root
    group: root
    mode: '0644'

- name: Mettre à jour le cache apt après l'ajout du dépôt
  apt:
    update_cache: yes

- name: Installer et démarrer MongoDB
  apt:
    name: mongodb-org
    state: present
  notify: restart mongod