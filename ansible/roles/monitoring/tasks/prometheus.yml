---
- name: Créer le utilisateur système Prometheus
  user:
    name: prometheus
    system: true
    shell: /bin/false

- name: Télécharger et extraire Prometheus
  unarchive:
    src: "https://github.com/prometheus/prometheus/releases/download/v2.51.0/prometheus-2.51.0.linux-amd64.tar.gz"
    dest: "/tmp"
    remote_src: yes

- name: Déplacer les binaires Prometheus
  copy:
    src: "/tmp/prometheus-2.51.0.linux-amd64/{{ item }}"
    dest: "/usr/local/bin/"
    remote_src: yes
    mode: '0755'
  loop:
    - prometheus
    - promtool

- name: Créer les répertoires de configuration et de données Prometheus
  file:
    path: "{{ item }}"
    state: directory
    owner: prometheus
    group: prometheus
    mode: '0755'
  loop:
    - /etc/prometheus
    - /var/lib/prometheus

- name: Configurer prometheus.yml (Cible Node.js port 3000)
  copy:
    dest: /etc/prometheus/prometheus.yml
    content: |
      global:
        scrape_interval: 15s

      scrape_configs:
        - job_name: "prometheus"
          static_configs:
            - targets: ["localhost:9090"]

        - job_name: "logichain-backend"
          static_configs:
            - targets: ["localhost:3000"]
    owner: prometheus
    group: prometheus
    mode: '0644'
  notify: restart prometheus

- name: Créer le fichier de service Systemd pour Prometheus
  copy:
    dest: /etc/systemd/system/prometheus.service
    content: |
      [Unit]
      Description=Prometheus
      Wants=network-online.target
      After=network-online.target

      [Service]
      User=prometheus
      Group=prometheus
      Type=simple
      ExecStart=/usr/local/bin/prometheus \
        --config.file=/etc/prometheus/prometheus.yml \
        --storage.tsdb.path=/var/lib/prometheus/ \
        --web.console.libraries=/etc/prometheus/console_libraries \
        --web.console.templates=/etc/prometheus/consoles

      [Install]
      WantedBy=multi-user.target
  notify: restart prometheus