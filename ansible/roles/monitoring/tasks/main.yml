- name: Installer les dépendances pour les dépôts externes
  apt:
    name:
      - gnupg
      - curl
    state: present
    update_cache: yes

- name: Télécharger et ajouter la clé GPG MongoDB
  get_url:
    url: https://www.mongodb.org/static/pgp/server-7.0.asc
    dest: /usr/share/keyrings/mongodb-server-7.0.gpg
    mode: '0644'

- name: Ajouter le dépôt officiel MongoDB pour Debian
  apt_repository:
    repo: "deb [ signed-by=/usr/share/keyrings/mongodb-server-7.0.gpg ] https://repo.mongodb.org/apt/debian bookworm/mongodb-org/7.0 main"
    state: present
    update_cache: yes

- name: Installer MongoDB
  apt:
    name: mongodb-org
    state: present

- name: Create prometheus system user
  user:
    name: prometheus
    system: true
    shell: /bin/false

- name: Download and extract Prometheus
  unarchive:
    src: "https://github.com/prometheus/prometheus/releases/download/v2.51.0/prometheus-2.51.0.linux-amd64.tar.gz"
    dest: "/tmp"
    remote_src: yes

- name: Move Prometheus binaries
  copy:
    src: "/tmp/prometheus-2.51.0.linux-amd64/{{ item }}"
    dest: "/usr/local/bin/"
    remote_src: yes
    mode: '0755'
  loop:
    - prometheus
    - promtool

- name: Install Grafana repository and package
  apt:
    deb: "https://dl.grafana.com/oss/release/grafana_10.4.0_amd64.deb"
    state: present